<div class="rules-container">
  <div class="section-header">
    <div>
      <h2>Règles de décision</h2>
      <p class="description">Créez des règles automatiques pour le traitement des demandes</p>
    </div>
    <button class="btn-primary" (click)="addRule()">
      <mat-icon>add</mat-icon>
      Ajouter une règle
    </button>
  </div>

  <div class="rules-list" cdkDropList (cdkDropListDropped)="drop($event)">
    <div *ngFor="let rule of rules; let i = index" 
         class="rule-item"
         cdkDrag
         [class.inactive]="!rule.isActive">
      <div class="drag-handle" cdkDragHandle>
        <mat-icon>drag_indicator</mat-icon>
      </div>
      
      <div class="rule-content">
        <div class="rule-header">
          <span class="rule-priority">#{{ i + 1 }}</span>
          <span class="rule-name">{{ rule.name }}</span>
          <span class="rule-badge" [class.active]="rule.isActive">
            {{ rule.isActive ? 'Actif' : 'Inactif' }}
          </span>
        </div>
        
        <div class="rule-body">
          <div class="condition">
            <span class="label">Condition :</span>
            <code>{{ rule.condition }}</code>
          </div>
          <div class="action">
            <span class="label">Action :</span>
            <span class="action-tag">{{ getActionLabel(rule.action) }}</span>
          </div>
        </div>
      </div>

      <div class="rule-actions">
        <button class="icon-btn" (click)="editRule(rule)" title="Modifier">
          <mat-icon>edit</mat-icon>
        </button>
        <button class="icon-btn toggle-btn" (click)="toggleRule(rule)" title="Activer/Désactiver">
          <mat-icon>{{ rule.isActive ? 'toggle_on' : 'toggle_off' }}</mat-icon>
        </button>
        <button class="icon-btn delete-btn" (click)="deleteRule(rule)" title="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="rules-empty" *ngIf="rules.length === 0">
    <mat-icon>rule</mat-icon>
    <p>Aucune règle configurée</p>
    <button class="btn-primary" (click)="addRule()">Créer votre première règle</button>
  </div>
</div>
