<!-- features/dashboard/dashboard.component.html -->
<div class="dashboard-redirect">
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Chargement de votre espace...</p>
  </div>
  
  <div *ngIf="!isLoading && user" class="redirect-container">
    <div class="user-avatar-large">
      {{ getInitials() }}
    </div>
    <h2>Bienvenue, {{ getFullName() }}</h2>
    <p class="role-label">Rôle : {{ userRole }}</p>
    <p class="redirect-message">Redirection vers votre tableau de bord...</p>
    <mat-spinner diameter="30"></mat-spinner>
  </div>
</div>
