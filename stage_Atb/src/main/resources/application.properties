# ==============================================
# ATB CREDIT INTELLIGENCE - Configuration
# ==============================================

# --- Application ---
spring.application.name=stage_Atb
server.port=8081

# --- Database PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5433/stage_atb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
# --- JPA / Hibernate ---
spring.jpa.open-in-view=false  
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Africa/Tunis

# --- JWT Configuration ---
jwt.secret=ATBSecretKeyForCreditIntelligence2026WithEnoughLengthForHS512Algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- IA Python API ---
ia.api.url=http://localhost:8000
ia.api.timeout=10000

# --- JMX ---
spring.jmx.enabled=false

# --- Logging ---
logging.level.com.atb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- CORS ---
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# --- Flyway ---
spring.flyway.enabled=false

# --- Spring Security ---
spring.security.user.name=admin
spring.security.user.password=admin123

# Upload configuration
app.upload.directory=uploads/documents
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================
# EMAIL (Gmail SMTP)
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================
# FRONTEND URL (pour le lien dans l'email)
# ==============================================
app.frontend.url=http://localhost:4200